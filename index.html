<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work Anniversary Dice Roll 🎲</title>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Inter', system-ui, -apple-system, sans-serif; 
    }
    
    /* Top-down wooden tabletop aesthetic */
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle, #8a5a36 0%, #3d230d 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }

    /* Top Left Roll History Panel */
    #history-panel {
      position: absolute;
      top: 24px;
      left: 24px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      padding: 18px 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      min-width: 220px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      z-index: 10;
    }
    #history-panel h3 { 
      font-size: 16px; 
      margin-bottom: 10px; 
      color: #2c1810; 
      display: flex; 
      justify-content: space-between;
    }
    #history-list { 
      list-style: none; 
      font-size: 14px; 
      color: #4a3525; 
    }
    #history-list li { 
      margin: 6px 0; 
      font-weight: 600; 
      animation: fadeIn 0.3s ease-in-out; 
    }

    /* Top Right Prize Legend Panel */
    #prize-legend {
      position: absolute;
      top: 24px;
      right: 24px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      padding: 18px 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      max-width: 280px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      z-index: 10;
    }
    #prize-legend h3 {
      font-size: 16px;
      margin-bottom: 10px;
      color: #2c1810;
      border-bottom: 2px solid #e2d8ce;
      padding-bottom: 6px;
    }
    .legend-list {
      list-style: none;
      font-size: 13px;
      color: #333;
    }
    .legend-list li {
      margin: 6px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .legend-badge {
      background: #2c1810;
      color: white;
      font-weight: bold;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      flex-shrink: 0;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Center Table Area for 3D Dice */
    .table-center {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 1000px;
    }

    /* 3D Dice styling with 5-second smooth transition */
    .dice {
      width: 110px;
      height: 110px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 5s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .face {
      position: absolute;
      width: 110px;
      height: 110px;
      background: #ffffff;
      border: 3px solid #e2d8ce;
      border-radius: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 38px;
      font-weight: 800;
      color: #2c1810;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.08);
    }

    /* Cube face rotations */
    .front  { transform: rotateY(0deg) translateZ(55px); }
    .back   { transform: rotateY(180deg) translateZ(55px); }
    .right  { transform: rotateY(90deg) translateZ(55px); }
    .left   { transform: rotateY(-90deg) translateZ(55px); }
    .top    { transform: rotateX(90deg) translateZ(55px); }
    .bottom { transform: rotateX(-90deg) translateZ(55px); }

    /* Bottom Control Bar */
    .controls {
      margin-bottom: 48px;
      text-align: center;
      z-index: 10;
    }
    .roll-btn {
      background: #27ae60;
      color: white;
      font-size: 20px;
      font-weight: 700;
      padding: 16px 42px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(39, 174, 96, 0.4);
      transition: all 0.2s ease;
    }
    .roll-btn:hover { 
      background: #219653; 
      transform: translateY(-2px); 
      box-shadow: 0 12px 24px rgba(39, 174, 96, 0.5); 
    }
    .roll-btn:disabled { 
      background: #828282; 
      cursor: not-allowed; 
      transform: none; 
      box-shadow: none; 
    }

    /* Result Modal Overlay */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(6px);
      justify-content: center; 
      align-items: center;
      z-index: 100;
    }
    .modal-content {
      background: white;
      padding: 40px;
      border-radius: 24px;
      text-align: center;
      max-width: 440px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      animation: popUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popUp {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-content h2 { 
      color: #27ae60; 
      font-size: 28px; 
      margin-bottom: 12px; 
    }
    .modal-content p { 
      margin: 20px 0; 
      font-size: 19px; 
      color: #333; 
      line-height: 1.5; 
    }
  </style>
</head>
<body>

  <!-- Top-Left History Panel -->
  <div id="history-panel">
    <h3>🎲 Roll History <span>(<span id="roll-count">0</span>/5)</span></h3>
    <ul id="history-list"></ul>
  </div>

  <!-- Top-Right Prize Legend -->
  <div id="prize-legend">
    <h3>🎁 Prize Guide</h3>
    <ul class="legend-list">
      <li><span class="legend-badge">1</span> 1 Day Extra Paid Leave 🏖️</li>
      <li><span class="legend-badge">2</span> Mystery Gift / Goodie 🎁</li>
      <li><span class="legend-badge">3</span> Custom Hoodie 🧥</li>
      <li><span class="legend-badge">4</span> Tumbler / Flask ☕</li>
      <li><span class="legend-badge">5</span> 2 Movie Tickets 🎟️</li>
      <li><span class="legend-badge">6</span> Shopping Gift Card 🛍️</li>
    </ul>
  </div>

  <!-- Table Area with 3D Dice -->
  <div class="table-center">
    <div class="dice" id="dice">
      <div class="face front">1</div>
      <div class="face back">6</div>
      <div class="face right">3</div>
      <div class="face left">4</div>
      <div class="face top">5</div>
      <div class="face bottom">2</div>
    </div>
  </div>

  <!-- Bottom Roll Button -->
  <div class="controls">
    <button class="roll-btn" id="roll-btn" onclick="rollDice()">Roll Dice 🎲</button>
  </div>

  <!-- Celebration Modal -->
  <div class="modal" id="result-modal">
    <div class="modal-content">
      <h2>🎉 Happy Anniversary!</h2>
      <p id="winner-text"></p>
      <button class="roll-btn" onclick="location.reload()">Try Again 🔄</button>
    </div>
  </div>

  <script>
    const prizeMap = {
      1: "1 Day Extra Paid Leave 🏖️",
      2: "Mystery Gift / Goodie 🎁",
      3: "Hoodie 🧥",
      4: "Insulated Stainless Steel Tumbler / Flask ☕",
      5: "2 Movie Tickets of Your Choice 🎟️",
      6: "Amazon / Shopping Gift Card 🛍️"
    };

    let rolls = [];
    let currentRoll = 0;
    const maxRolls = 5;
    let rotationX = 0;
    let rotationY = 0;

    // Face rotation angles
    const faceRotations = {
      1: { x: 0, y: 0 },
      6: { x: 0, y: 180 },
      3: { x: 0, y: -90 },
      4: { x: 0, y: 90 },
      5: { x: -90, y: 0 },
      2: { x: 90, y: 0 }
    };

    function rollDice() {
      if (currentRoll >= maxRolls) return;

      const btn = document.getElementById("roll-btn");
      btn.disabled = true;

      // Pure random number (1 to 6)
      const rolledNumber = Math.floor(Math.random() * 6) + 1;
      rolls.push(rolledNumber);
      currentRoll++;

      const dice = document.getElementById("dice");
      const targetFace = faceRotations[rolledNumber];

      // Cumulative rotations to ensure it rolls forward smoothly every time
      rotationX += 360 * 5 + targetFace.x - (rotationX % 360);
      rotationY += 360 * 5 + targetFace.y - (rotationY % 360);
      
      dice.style.transform = `rotateX(${rotationX}deg) rotateY(${rotationY}deg)`;

      // Wait 5 seconds for full rolling animation
      setTimeout(() => {
        // Append to top-left panel
        document.getElementById("roll-count").innerText = currentRoll;
        const historyList = document.getElementById("history-list");
        const li = document.createElement("li");
        li.innerText = `Roll ${currentRoll}: Number ${rolledNumber}`;
        historyList.appendChild(li);

        if (currentRoll < maxRolls) {
          btn.disabled = false;
        } else {
          finishGame();
        }
      }, 5000);
    }

    function finishGame() {
      // Calculate highest frequency number
      const counts = {};
      rolls.forEach(num => counts[num] = (counts[num] || 0) + 1);

      let maxFreq = 0;
      let winningNumber = rolls[0];

      for (const num in counts) {
        if (counts[num] > maxFreq) {
          maxFreq = counts[num];
          winningNumber = num;
        }
      }

      const prize = prizeMap[winningNumber];
      document.getElementById("winner-text").innerHTML = 
        `You rolled number <b>${winningNumber}</b> most frequently (${maxFreq} time${maxFreq > 1 ? 's' : ''})!<br><br><b>Your Gift:</b><br><span style="color:#27ae60; font-size: 22px; font-weight: bold;">${prize}</span>`;
      
      setTimeout(() => {
        document.getElementById("result-modal").style.display = "flex";
      }, 600);
    }
  </script>
</body>
</html>
